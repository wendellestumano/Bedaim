[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcpp-bedaim"
version = "0.1.0"
description = "Persistent, model-agnostic engineering intelligence core for the BedAim repository"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BedAim contributors" }]
dependencies = []

[project.scripts]
chatcpp = "chatcpp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chatcpp*"]
