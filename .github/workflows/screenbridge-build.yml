name: ScreenBridge Android APK
on:
  push:
    branches:
      - feature/screenbridge-android-app-20261019
      - feature/screenbridge-status-overlay-20261019\n      - feature/screenbridge-recorder-live-control-20261020
    paths:
      - "ScreenBridge/**"
      - ".github/workflows/screenbridge-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing bundle
        id: signing
        env:
          SCREENBRIDGE_SIGNING_BUNDLE_B64: ${{ secrets.SCREENBRIDGE_SIGNING_BUNDLE_B64 }}
        shell: bash
        run: |
          if [ -z "${SCREENBRIDGE_SIGNING_BUNDLE_B64:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signing key not configured::No APK was created. Add the SCREENBRIDGE_SIGNING_BUNDLE_B64 Actions secret to enable repeatable, permission-preserving updates."
            exit 0
          fi

          SIGN_DIR="$RUNNER_TEMP/screenbridge-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$SCREENBRIDGE_SIGNING_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/screenbridge-signing-bundle.zip"
          unzip -oq "$RUNNER_TEMP/screenbridge-signing-bundle.zip" -d "$SIGN_DIR"
          test -s "$SIGN_DIR/screenbridge-signing.p12"
          test -s "$SIGN_DIR/signing.properties"
          grep -q '^storePassword=' "$SIGN_DIR/signing.properties"
          grep -q '^keyAlias=' "$SIGN_DIR/signing.properties"
          grep -q '^keyPassword=' "$SIGN_DIR/signing.properties"
          chmod 600 "$SIGN_DIR/screenbridge-signing.p12" "$SIGN_DIR/signing.properties"
          echo "SCREENBRIDGE_SIGNING_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/screenbridge-signing-bundle.zip"

      - name: Build APK with persistent signature
        if: steps.signing.outputs.available == 'true'
        run: gradle --no-daemon --stacktrace -p ScreenBridge assembleDebug

      - name: Upload stable-signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBridge-stable-signed-apk
          path: ScreenBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/screenbridge-signing" "$RUNNER_TEMP/screenbridge-signing-bundle.zip"
