name: ScreenBridge Android APK
on:
  push:
    branches:
      - feature/screenbridge-android-app-20261019
    paths:
      - "ScreenBridge/**"
      - ".github/workflows/screenbridge-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p ScreenBridge assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBridge-debug-apk
          path: ScreenBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
