name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, integrate/bedaim-shiftblade-hitbox-20261017, test/autohit-autototem-mainline-20261017, feature/diagnostics-download-autosave-20261017, fix/autohit-input-diagnostics-20261017, fix/autohit-gamemode-runtime-diagnostics-20261018, recovery/bedrockaim-autohit-preserved-20261018, rebuild/autohit-protohax-prelag-20261019, perf/autohit-tick-throttle-20261019, experiment/build898-autohit-compile-fps-20261020]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install host test dependencies
        working-directory: tests
        run: xmake require -y -P . nlohmann_json

      - name: Run host regression tests
        working-directory: tests
        run: |
          xmake f -y -P . -p linux -a x86_64 -m debug
          xmake -y -P .
          xmake run -P . menu_config_value_test
          xmake run -P . aimassist_math_test
          xmake run -P . actor_vector_validation_test
          xmake run -P . atomic_config_writer_test
          xmake run -P . diagnostics_test
          xmake run -P . autohit_guards_test
          xmake run -P . autohit_weapon_profile_test
          xmake run -P . autototem_policy_test

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockTools-levipack
          path: build/android/arm64-v8a/release/BedrockTools.levipack
          if-no-files-found: error
