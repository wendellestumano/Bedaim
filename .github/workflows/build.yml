name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, integrate/bedaim-shiftblade-hitbox-20261017, test/autohit-autototem-mainline-20261017, feature/diagnostics-download-autosave-20261017, fix/local-player-tick-diagnostics-20261017, feature/elytra-aim-gamemode-checker-20261022, feat/unglide-java-vm-and-custom-profiles-20261023, feat/blockesp-independent-module-20261029, research/itemduplicator-inventory-observer-26.60, research/mainhand-survival-dupe-26.60, research/bundle-hopper-extractor-26.60]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply experimental Bundle Extractor patch
        run: |
          gzip -dc bundle-hopper-extractor-26.60.patch.gz > /tmp/bundle-extractor.patch
          git apply --check --exclude=.github/workflows/build.yml /tmp/bundle-extractor.patch
          git apply --exclude=.github/workflows/build.yml /tmp/bundle-extractor.patch

      - name: Apply automatic container Bundle scanner patch
        run: |
          base64 -d bundle-hopper-extractor-autoscan-26.60.patch.gz.b64 | gzip -dc > /tmp/bundle-extractor-autoscan.patch
          git apply --check /tmp/bundle-extractor-autoscan.patch
          git apply /tmp/bundle-extractor-autoscan.patch

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install host test dependencies
        working-directory: tests
        run: xmake require -y -P . nlohmann_json

      - name: Run host regression tests
        working-directory: tests
        run: |
          xmake f -y -P . -p linux -a x86_64 -m debug
          xmake -y -P . 
          xmake run -P . menu_config_value_test
          xmake run -P . aimassist_math_test
          xmake run -P . atomic_config_writer_test
          xmake run -P . diagnostics_test
          xmake run -P . autohit_guards_test
          xmake run -P . autohit_weapon_profile_test
          xmake run -P . autototem_policy_test
          xmake run -P . mace_unglide_policy_test
          xmake run -P . safe_memory_read_test
          xmake run -P . player_game_type_test
          xmake run -P . xray_block_policy_test
          xmake run -P . blockesp_event_queue_test
          xmake run -P . inventory_research_test

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: Bedaim-levipack
          path: build/android/arm64-v8a/release/Bedaim.levipack
          if-no-files-found: error
