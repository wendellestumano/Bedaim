name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, integrate/bedaim-shiftblade-hitbox-20261017, feature/diagnostics-download-autosave-20261017]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yaml-validator"
          "$RUNNER_TEMP/yaml-validator/bin/python" -m pip install --disable-pip-version-check --quiet PyYAML
          "$RUNNER_TEMP/yaml-validator/bin/python" - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml"))
          if not files:
              raise SystemExit("No workflow YAML files found")
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"YAML syntax OK: {path}")
          PY

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install host test dependencies
        working-directory: tests
        run: xmake require -y -P . nlohmann_json

      - name: Run host regression tests
        working-directory: tests
        run: |
          xmake f -y -P . -p linux -a x86_64 -m debug
          xmake -y -P .
          xmake run -P . menu_config_value_test
          xmake run -P . aimassist_math_test
          xmake run -P . atomic_config_writer_test
          xmake run -P . diagnostics_test

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockTools-levipack
          path: build/android/arm64-v8a/release/BedrockTools.levipack
          if-no-files-found: error
