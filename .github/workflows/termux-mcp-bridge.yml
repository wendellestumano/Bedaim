name: Termux MCP Bridge Android APK

on:
  push:
    branches:
      - tools/termux-mcp-bridge-alpha
    paths:
      - 'TermuxMCPBridge/**'
      - '.github/workflows/termux-mcp-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TermuxMCPBridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-mcp-bridge-debug-apk
          path: TermuxMCPBridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
